        <text x="20" y="42" font-family="Arial" font-size="12" font-weight="bold"
              text-anchor="middle" fill="#667eea">40+</text>
    </g>

    <!-- Text -->
    <text x="75" y="45" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#667eea">Saúde 40+</text>
    <text x="75" y="65" font-family="Arial, sans-serif" font-size="12" fill="#999">Saúde e Bem-estar</text>
