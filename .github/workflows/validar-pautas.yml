name: Validar pautas

on:
  workflow_dispatch:
    inputs:
      limite:
        description: 'Quantas pautas validar online (vazio = todas as livres)'
        required: false
        default: ''

jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validar pautas (regras + fontes online)
        run: |
          if [ -n "${{ github.event.inputs.limite }}" ]; then
            node scripts/validar-pautas.js --online --limite "${{ github.event.inputs.limite }}"
          else
            node scripts/validar-pautas.js --online
          fi
