name: Estimar demanda (Google Trends via SerpApi)

# Estima o volume mensal das frases de data/pesquisa/trends-entrada.txt pelo Google Trends (SerpApi), comparando com 2 âncoras de
# volume medido, grava em data/pesquisa/demanda-validada.json (marcado "estimado": true) e recalcula a pontuação do estoque.
# Gasta ~1 busca da SerpApi a cada 3 frases (31 frases = ~11 buscas; o plano grátis tem 250 por mês). Precisa do secret SERPAPI_API_KEY.
on:
  workflow_dispatch:

concurrency:
  group: produce-articles
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  estimar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN }}
          ref: main
      - uses: actions/setup-node@v3
        with:
          node-version: '18'
      - run: npm install
      - name: 📊 Estimar volume (Google Trends)
        env:
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
        run: node scripts/volume-trends.js
      - name: 🔁 Recalcular pontuação do estoque
        run: node scripts/recalcular-pontuacao.js
      - name: 📤 Commit & Push (uma vez, para poupar deploys)
        run: |
          git config user.name "Health 40+ Bot"
          git config user.email "bot@health40plus.com"
          git add data/pesquisa/demanda-validada.json data/pesquisa/trends-resultado.json data/articles.json data/conteudo/ABAIXO-DE-90.md
          if git diff --cached --quiet; then echo "⏸️  Nada novo"; exit 0; fi
          git commit -m "📊 Demanda estimada pelo Google Trends (SerpApi) e pontuação do estoque recalculada"
          git remote set-url origin https://x-access-token:${{ secrets.GH_TOKEN }}@github.com/${{ github.repository }}.git
          ok=0
          for i in 1 2 3; do
            if git pull --rebase origin main && git push origin main; then ok=1; break; fi
            echo "⚠️  tentativa $i falhou, repetindo..."; sleep 5
          done
          [ "$ok" = 1 ] || { echo "❌ push falhou após 3 tentativas"; exit 1; }
