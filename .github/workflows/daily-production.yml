name: 📝 Daily Article Production

on:
  schedule:
    # Produzir artigos diariamente às 9h (UTC)
    - cron: '0 9 * * *'
  workflow_dispatch:

jobs:
  produce-articles:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: 📝 FASE 10 - Produce Content
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_SEARCH_API_KEY: ${{ secrets.GOOGLE_SEARCH_API_KEY }}
          GOOGLE_SEARCH_ENGINE_ID: ${{ secrets.GOOGLE_SEARCH_ENGINE_ID }}
        run: |
          echo "🎯 Produzindo artigos..."
          node scripts/production.js

      - name: 📋 FASE 11 - Editorial Review
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          echo "✅ Revisando qualidade..."
          node scripts/review-article.js

      - name: 📢 FASE 12 - Publish
        env:
          PEXEL_API_KEY: ${{ secrets.PEXEL_API_KEY }}
        run: |
          echo "🌐 Publicando no blog..."
          node scripts/publish-article.js

      - name: 🔧 Setup Git
        run: |
          git config user.name "Health 40+ Bot"
          git config user.email "bot@health40plus.com"

      - name: 📤 Commit & Push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git add .
            git commit -m "🤖 Auto: Daily article production"
            git push origin main
            echo "✅ Artigos publicados!"
          else
            echo "⏸️  Nenhum artigo novo para publicar"
          fi

      - name: 🚀 Vercel Deploy Notification
        run: |
          echo "✅ Vercel será notificado via webhook"
          echo "📊 Blog será atualizado automaticamente"

      - name: 📊 Report Stats
        if: always()
        run: |
          node -e "
          const fs = require('fs');
          const data = JSON.parse(fs.readFileSync('data/articles.json'));
          const published = data.articles.filter(a => a.status === 'published').length;
          const ready = data.articles.filter(a => a.status === 'ready_for_publication').length;
          console.log(\`\n📈 Blog Stats:\`);
          console.log(\`   📝 Total articles: \${data.articles.length}\`);
          console.log(\`   ✅ Ready for publish: \${ready}\`);
          console.log(\`   🌐 Published: \${published}\`);
          "

