name: 📝 Content Production & Publication

on:
  # Agenda desligada (sistema antigo; o robô novo é o daily-production.yml). Economiza API.
  workflow_dispatch:

jobs:
  production:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Check articles published today
        id: check_quota
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_SEARCH_API_KEY: ${{ secrets.GOOGLE_SEARCH_API_KEY }}
          GOOGLE_SEARCH_ENGINE_ID: ${{ secrets.GOOGLE_SEARCH_ENGINE_ID }}
        run: |
          # Script will check if we've published 2 articles already
          # If yes, skip production. If no, continue.
          echo "quota_available=true" >> $GITHUB_OUTPUT

      - name: Run content production
        if: steps.check_quota.outputs.quota_available == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_SEARCH_API_KEY: ${{ secrets.GOOGLE_SEARCH_API_KEY }}
          GOOGLE_SEARCH_ENGINE_ID: ${{ secrets.GOOGLE_SEARCH_ENGINE_ID }}
        run: npm run production

      - name: Build blog
        run: npm run build

      - name: Commit new article
        if: always()
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "Production Bot"
          git add content/articles/ data/articles.json data/editorial-calendar.json
          git commit -m "📝 Publish new article" || echo "No new article published"

      - name: Push changes
        if: always()
        run: |
          git push origin main || echo "No changes to push"

      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
        run: |
          npx vercel deploy --prod --token=$VERCEL_TOKEN
