name: Comparar nossos artigos com o topo do Google

# Baixa as páginas do topo do Google de cada pauta (URLs de data/pesquisa/serp-resultados.json e das fontes da pauta),
# mede palavras, subtítulos, imagens, FAQ, título e descrição, e compara com o nosso artigo.
# Grava data/pesquisa/comparacao-topo.md e .json com as LACUNAS (o que melhorar para chegar ao top 10) e as vantagens.
# Rode no Actions: o contêiner da sessão de IA bloqueia vários sites de saúde.

on:
  workflow_dispatch:
    inputs:
      so:
        description: 'Só pautas que contenham este texto (vazio = todas)'
        required: false
        default: ''
  schedule:
    - cron: '17 9 * * 1'   # toda segunda, 09:17 UTC (fora do horário cheio)

permissions:
  contents: write

jobs:
  comparar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 📊 Comparar com o topo
        run: |
          if [ -n "${{ inputs.so }}" ]; then
            node scripts/comparar-topo.js --so "${{ inputs.so }}"
          else
            node scripts/comparar-topo.js
          fi
      - name: 💾 Gravar resultados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/pesquisa/comparacao-topo.json data/pesquisa/comparacao-topo.md
          if git diff --cached --quiet; then echo "Nada novo"; exit 0; fi
          git commit -m "Comparação com o topo do Google atualizada"
          ok=0
          for i in 1 2 3; do
            if git pull --rebase origin main && git push; then ok=1; break; fi
            sleep 5
          done
          [ "$ok" = 1 ] || exit 1
