name: Validar Google (SERP) das candidatas

on:
  workflow_dispatch:
    inputs:
      limite:
        description: 'Quantas candidatas validar (1 consulta cada)'
        required: false
        default: '25'
      promover:
        description: 'Promover as aprovadas direto para a fila de ouro'
        type: boolean
        required: false
        default: true

permissions:
  contents: write

jobs:
  serp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 🔎 Validar candidatas no Google
        env:
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
        run: |
          if [ "${{ inputs.promover }}" = "true" ]; then
            node scripts/validar-serp.js --limite "${{ inputs.limite }}" --promover
          else
            node scripts/validar-serp.js --limite "${{ inputs.limite }}"
          fi
      - name: ✅ Conferir regras da fila
        run: node scripts/validar-pautas.js
        continue-on-error: true
      - name: 💾 Gravar resultados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || (git commit -m "Validação no Google: candidatas analisadas e promovidas" && git push)
